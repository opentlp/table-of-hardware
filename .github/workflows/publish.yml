# Publishes the generated site to GitHub Pages.
#
# `site/` is gitignored and rebuilt here, so the repository never carries
# generated output and a diff is always a real change to the data.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The catalogue lives in another repository. This keeps the published site
  # fresh even when only packages/hardware changes.
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out the OpenTLP hardware source
        uses: actions/checkout@v6
        with:
          repository: opentlp/opentlp
          path: opentlp-source
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install hardware validation dependencies
        working-directory: opentlp-source
        run: npm ci --workspace @opentlp/hardware --include-workspace-root=false
      - name: Validate the canonical hardware source
        working-directory: opentlp-source
        run: npm run validate --workspace @opentlp/hardware
      - run: npm run build
        env:
          OPENTLP_HARDWARE_ROOT: ${{ github.workspace }}/opentlp-source/packages/hardware
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
