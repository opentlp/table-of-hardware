# Every claim in this database is meant to be checkable, so the checks run on
# every change rather than on a release. A pull request that fails here is
# telling a contributor something specific and fixable, which is the point.

name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out the OpenTLP hardware source
        uses: actions/checkout@v6
        with:
          repository: opentlp/opentlp
          path: opentlp-source
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install hardware validation dependencies
        working-directory: opentlp-source
        run: npm ci --workspace @opentlp/hardware --include-workspace-root=false
      - name: Validate the canonical hardware source
        working-directory: opentlp-source
        run: npm run validate --workspace @opentlp/hardware
      # The build is a second gate: it refuses malformed pages, resolves the
      # cross-references, and proves the site still generates.
      - run: npm run build
        env:
          OPENTLP_HARDWARE_ROOT: ${{ github.workspace }}/opentlp-source/packages/hardware
      # The drift check runs where the consuming application lives, since that
      # is where the catalogue dump comes from. Nothing to do here until a dump
      # is committed or fetched.
